version: 2

updates:
  # Update npm packages
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    open-pull-requests-limit: 10

    # Minimum age before suggesting updates (supply chain security).
    # Security updates bypass the cooldown.
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3

    # Group packages into shared PR
    groups:
      test-tools:
        patterns:
          - '@testing-library/*'
          - '@vitest/*'
          - 'jsdom'
          - 'vite'
          - 'vitest'
          - 'vitest-*'

      storybook:
        patterns:
          - '@storybook/*'
          - 'storybook'

      css-tools:
        patterns:
          - 'autoprefixer'
          - 'cssnano'
          - 'cssnano-*'
          - 'postcss-*'
          - 'sass-*'

      dev-tools:
        patterns:
          - '@babel/*'
          - '@emnapi/*'
          - '@prefresh/*'
          - 'audit-ci'
          - 'babel-loader'
          - 'cheerio'
          - 'clean-webpack-plugin'
          - 'copy-webpack-plugin'
          - 'husky'
          - 'nodemon'
          - 'npm-run-all*'
          - 'source-map-loader'
          - 'terser-webpack-plugin'
          - 'webpack'
          - 'webpack-*'

      map:
        patterns:
          - '@arcgis/*'
          - '@defra/interactive-map'
          - 'flatgeobuf'
          - 'geotiff'
          - 'ol'
          - 'pmtiles'
          - 'proj4'

      frontend:
        patterns:
          - '@base-ui/*'
          - '@dnd-kit/*'
          - '@lucide/*'
          - 'govuk-*'
          - 'lucide-preact'
          - 'preact'
          - 'react-colorful'

      lint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - 'globals'
          - 'neostandard'
          - 'stylelint'
          - 'stylelint-*'

      logging:
        patterns:
          - '*-pino'
          - '*-pino-format'
          - 'pino'
          - 'pino-*'

      defra:
        exclude-patterns:
          - '@defra/interactive-map'
        patterns:
          - '@defra/*'

      server:
        # hapi-pino belongs to the logging group
        exclude-patterns:
          - 'hapi-pino'
        patterns:
          - '@aws-sdk/*'
          - '@hapi/*'
          - 'blankie'
          - 'convict'
          - 'convict-*'
          - 'date-fns'
          - 'global-agent'
          - 'hapi-*'
          - 'ioredis'
          - 'lodash'
          - 'node-fetch'
          - 'nunjucks'
          - 'openid-client'
          - 'semver'
          - 'undici'

    ignore:
      # neostandard 0.13 supports ESLint 9 and supplies the JSX logic checks
      - dependency-name: 'eslint'
        versions: ['>=10']

      # 0.14 temporarily removes JSX logic checks, review again after 0.14.x
      - dependency-name: 'neostandard'
        versions: ['>=0.14.0 <0.15.0']

      # interactive-map requires Preact 10, keep one shared instance
      - dependency-name: 'preact'
        versions: ['>=11']

      # global-agent v4 broke TLS under Node 24 corporate proxies
      - dependency-name: 'global-agent'
        versions: ['>=4']

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      time: '10:30'
      timezone: 'Europe/London'

    versioning-strategy: increase

    allow:
      # Include direct package.json updates
      - dependency-type: direct

  # Update GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop

    # Group every action bump into a single shared PR
    groups:
      actions:
        patterns:
          - '*'

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      time: '10:30'
      timezone: 'Europe/London'
