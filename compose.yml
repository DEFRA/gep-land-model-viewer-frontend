services:
  redis:
    image: redis:7.2.3-alpine3.18
    ports:
      - '6380:6379'
    restart: always
    networks:
      - cdp-tenant

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.2
    command: start-dev --import-realm --http-port=8081 --http-relative-path=/land-model
    ports:
      - '8082:8081'
    environment:
      KC_HOSTNAME: http://localhost:8082/land-model
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./compose/keycloak/defra-local-realm.json:/opt/keycloak/data/import/defra-local-realm.json
    networks:
      - cdp-tenant

  garage:
    image: dxflrs/garage:v2.3.0
    command: /garage server --single-node --default-bucket
    ports:
      - '127.0.0.1:3900:3900'
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: garage-access-key-id
      GARAGE_DEFAULT_SECRET_KEY: garage-secret-access-key
      GARAGE_DEFAULT_BUCKET: datasets
    volumes:
      - ./compose/garage/garage.toml:/etc/garage.toml:ro
      - garage-metadata:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ['CMD', '/garage', 'status']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - cdp-tenant

  garage-import-test-data:
    image: public.ecr.aws/aws-cli/aws-cli:2.36.49
    entrypoint: ['/bin/sh', '/init/import-test-data.sh']
    environment:
      AWS_ENDPOINT_URL: http://garage:3900
      AWS_DEFAULT_REGION: garage
      AWS_ACCESS_KEY_ID: garage-access-key-id
      AWS_SECRET_ACCESS_KEY: garage-secret-access-key
      AWS_PAGER: ''
    volumes:
      - ./compose/garage:/init:ro
    depends_on:
      garage:
        condition: service_healthy
    networks:
      - cdp-tenant

volumes:
  garage-metadata:
  garage-data:

networks:
  cdp-tenant:
    driver: bridge
